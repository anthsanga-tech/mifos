<div class="login-page">
  <div class="login-atmosphere" aria-hidden="true"></div>

  <section class="login-panel">
    <p class="brand">Mini Fineract</p>
    <h1 class="headline">Sign in</h1>
    <p class="lede" *ngIf="!oauthEnabled">Sign in with your training account (HTTP Basic).</p>
    <p class="lede" *ngIf="oauthEnabled">Sign in via Keycloak (OAuth2 / JWT), Fineract-style.</p>

    <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <label class="field">
        <span>Username</span>
        <input
          name="username"
          type="text"
          autocomplete="username"
          [(ngModel)]="username"
          required
          [disabled]="busy"
        />
      </label>

      <label class="field">
        <span>Password</span>
        <input
          name="password"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          required
          [disabled]="busy"
        />
      </label>

      <p class="error" *ngIf="error">{{ error }}</p>

      <button type="submit" class="submit" [disabled]="busy || loginForm.invalid">
        {{ busy ? 'Signing in…' : 'Continue' }}
      </button>
    </form>

    <p class="hint">
      Default credentials: <strong>mifos</strong> / <strong>password</strong>
      <span *ngIf="oauthEnabled"> · IdP: Keycloak :9000</span>
    </p>
  </section>
</div>
