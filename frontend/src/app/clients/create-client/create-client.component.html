<div class="page">
  <div class="toolbar">
    <a class="back" routerLink="/clients">← Clients</a>
  </div>

  <section class="panel">
    <header class="panel-header">
      <h1 class="title">Create client</h1>
      <p class="lede">Add a new training client.</p>
    </header>

    <p class="error" *ngIf="error">{{ error }}</p>

    <form class="form" [formGroup]="clientForm" (ngSubmit)="onSubmit()" novalidate>
      <p class="section-label">Identity</p>
      <div class="field-grid">
        <label class="field">
          <span>First name</span>
          <input type="text" formControlName="firstName" autocomplete="given-name" [class.invalid]="fieldError('firstName')" />
          <p class="field-error" *ngIf="fieldError('firstName')">{{ fieldError('firstName') }}</p>
        </label>
        <label class="field">
          <span>Last name</span>
          <input type="text" formControlName="lastName" autocomplete="family-name" [class.invalid]="fieldError('lastName')" />
          <p class="field-error" *ngIf="fieldError('lastName')">{{ fieldError('lastName') }}</p>
        </label>
        <label class="field">
          <span>Email <em>(optional)</em></span>
          <input type="email" formControlName="email" autocomplete="email" [class.invalid]="fieldError('email')" />
          <p class="field-error" *ngIf="fieldError('email')">{{ fieldError('email') }}</p>
        </label>
        <label class="field">
          <span>Phone number</span>
          <input type="tel" formControlName="phoneNumber" autocomplete="tel" inputmode="numeric" [class.invalid]="fieldError('phoneNumber')" />
          <p class="field-error" *ngIf="fieldError('phoneNumber')">{{ fieldError('phoneNumber') }}</p>
        </label>
        <label class="field">
          <span>Date of birth</span>
          <input type="date" formControlName="dateOfBirth" [class.invalid]="fieldError('dateOfBirth')" />
          <p class="field-error" *ngIf="fieldError('dateOfBirth')">{{ fieldError('dateOfBirth') }}</p>
        </label>
        <label class="field">
          <span>Gender</span>
          <input type="text" formControlName="gender" [class.invalid]="fieldError('gender')" />
          <p class="field-error" *ngIf="fieldError('gender')">{{ fieldError('gender') }}</p>
        </label>
      </div>

      <p class="section-label">Address</p>
      <div class="field-grid">
        <label class="field field-wide">
          <span>Street</span>
          <input type="text" formControlName="address" autocomplete="street-address" [class.invalid]="fieldError('address')" />
          <p class="field-error" *ngIf="fieldError('address')">{{ fieldError('address') }}</p>
        </label>
        <label class="field">
          <span>City</span>
          <input type="text" formControlName="city" autocomplete="address-level2" [class.invalid]="fieldError('city')" />
          <p class="field-error" *ngIf="fieldError('city')">{{ fieldError('city') }}</p>
        </label>
        <label class="field">
          <span>State</span>
          <input type="text" formControlName="state" autocomplete="address-level1" [class.invalid]="fieldError('state')" />
          <p class="field-error" *ngIf="fieldError('state')">{{ fieldError('state') }}</p>
        </label>
        <label class="field">
          <span>Zip code</span>
          <input type="text" formControlName="zipCode" autocomplete="postal-code" [class.invalid]="fieldError('zipCode')" />
          <p class="field-error" *ngIf="fieldError('zipCode')">{{ fieldError('zipCode') }}</p>
        </label>
        <label class="field">
          <span>Country</span>
          <input type="text" formControlName="country" autocomplete="country-name" [class.invalid]="fieldError('country')" />
          <p class="field-error" *ngIf="fieldError('country')">{{ fieldError('country') }}</p>
        </label>
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary" [disabled]="saving">
          {{ saving ? 'Saving…' : 'Create client' }}
        </button>
        <button type="button" class="btn-secondary" (click)="cancel()" [disabled]="saving">
          Cancel
        </button>
      </div>
    </form>
  </section>
</div>
