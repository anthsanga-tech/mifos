server.port=8088
spring.application.name=mini-fineract-provider

spring.datasource.url=jdbc:postgresql://localhost:5433/mini_fineract
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

training.savings.maker-checker.threshold=10000

spring.jersey.application-path=/mini-fineract-provider/api

# --- Auth (same idea as Fineract / web-app: Basic default, OAuth optional) ---
# Match Apache Fineract defaults: basicauth=true, oauth2=false
training.security.basicauth.enabled=true
training.security.oauth2.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000/realms/training

# To use OAuth2 / JWT (Keycloak) like Fineract OAuth mode:
# training.security.basicauth.enabled=false
# training.security.oauth2.enabled=true
# (+ start Keycloak, set frontend environment.oauth.enabled = true)

# --- Logging (training / development) ---
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.level.root=INFO
logging.level.org.openmf.training=DEBUG
logging.level.org.springframework.security=INFO
# Uncomment next line to see SQL (noisy):
# logging.level.org.hibernate.SQL=DEBUG
